name: Publish Python

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'libs/python/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/python

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/python/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches tag
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${PROJECT_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject.toml version (${PROJECT_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/python/dist
