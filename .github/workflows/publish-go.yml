name: Publish Go

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'libs/go/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/go

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/go/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.sum

      - name: Warm Go proxy
        env:
          GOPROXY: proxy.golang.org
        run: go list -m "github.com/ajanuary/afid/libs/go@${{ steps.version.outputs.version }}"
