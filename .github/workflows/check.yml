name: Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: taiki-e/install-action@v2.77.6
        with:
          tool: just

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Run check
        run: just check-java

  check-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: taiki-e/install-action@v2.77.6
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Run check
        run: just check-python

  check-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: taiki-e/install-action@v2.77.6
        with:
          tool: just

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run check
        run: just check-rust

  check-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: taiki-e/install-action@v2.77.6
        with:
          tool: just

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.sum

      - name: Run check
        run: just check-go

  check-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: taiki-e/install-action@v2.77.6
        with:
          tool: just

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.7
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: libs/typescript/pnpm-lock.yaml

      - name: Install TypeScript dependencies
        working-directory: libs/typescript
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: just check-typescript

  check:
    if: always()
    needs:
      - check-java
      - check-python
      - check-rust
      - check-typescript
      - check-go
    runs-on: ubuntu-latest

    steps:
      - name: Verify all language checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
