name: Publish TypeScript

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'libs/typescript/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/typescript/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.7
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: libs/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PRERELEASE="${VERSION#*-}"
          if [ "${PRERELEASE}" = "${VERSION}" ]; then
            TAG=latest
          else
            TAG="${PRERELEASE%%.*}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag '${{ steps.disttag.outputs.tag }}'
