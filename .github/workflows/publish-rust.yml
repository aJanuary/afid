name: Publish Rust

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'libs/rust/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/rust/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${CARGO_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
