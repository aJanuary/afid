name: Publish

on:
  release:
    types: [published]

jobs:
  go:
    if: startsWith(github.event.release.tag_name, 'libs/go/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/go

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/go/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.sum

      - name: Warm Go proxy
        env:
          GOPROXY: proxy.golang.org
        run: go list -m "github.com/ajanuary/afid/libs/go@${{ steps.version.outputs.version }}"

  java:
    if: startsWith(github.event.release.tag_name, 'libs/java/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/java

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/java/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify gradle.properties version matches tag
        run: |
          GRADLE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${GRADLE_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::gradle.properties version (${GRADLE_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  python:
    if: startsWith(github.event.release.tag_name, 'libs/python/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/python

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/python/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches tag
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${PROJECT_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject.toml version (${PROJECT_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/python/dist

  rust:
    if: startsWith(github.event.release.tag_name, 'libs/rust/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/rust/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${CARGO_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  typescript:
    if: startsWith(github.event.release.tag_name, 'libs/typescript/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#libs/typescript/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.7
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: libs/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PRERELEASE="${VERSION#*-}"
          if [ "${PRERELEASE}" = "${VERSION}" ]; then
            TAG=latest
          else
            TAG="${PRERELEASE%%.*}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag '${{ steps.disttag.outputs.tag }}'
