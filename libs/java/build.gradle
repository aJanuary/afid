plugins {
	id 'java-library'
	id 'com.diffplug.spotless' version '8.4.0'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'me.champeau.jmh' version '0.7.3'
	id 'com.vanniktech.maven.publish' version '0.36.0'
}

repositories {
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
	testImplementation 'com.google.truth:truth:1.4.5'
	testImplementation 'org.mockito:mockito-core:5.23.0'
	testImplementation 'net.jqwik:jqwik:1.9.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

spotless {
	java {
		googleJavaFormat()
	}
}

tasks.named('test') {
	useJUnitPlatform {
		includeEngines 'junit-jupiter', 'jqwik'
	}
}

pitest {
	targetClasses = ['com.ajanuary.afidgen.*']
	junit5PluginVersion = '1.2.3'
}

jmh {
	fork = 1
	warmupIterations = 3
	iterations = 5
	timeUnit = 'us'
}

mavenPublishing {
	publishToMavenCentral(true)
	signAllPublications()

	coordinates(project.group.toString(), 'afidgen', project.version.toString())

	pom {
		name = 'afidgen'
		description = 'Generate afid ids — human-friendly random identifiers.'
		url = 'https://github.com/ajanuary/afid'
		licenses {
			license {
				name = 'MIT License'
				url = 'https://opensource.org/licenses/MIT'
				distribution = 'repo'
			}
		}
		developers {
			developer {
				id = 'ajanuary'
				name = 'Andrew January'
				url = 'https://github.com/ajanuary'
			}
		}
		scm {
			url = 'https://github.com/aJanuary/afid'
			connection = 'scm:git:git://github.com/aJanuary/afid.git'
			developerConnection = 'scm:git:ssh://github.com/aJanuary/afid.git'
		}
	}
}