[project]
name = "afidgen"
version = "1.0.0"
description = "An ID format designed to meet the trade-off between space and human readability."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Andrew January", email = "andrew@ajanuary.com" }]
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-benchmark>=5",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "ty>=0.0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
