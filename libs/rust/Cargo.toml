[package]
name = "afidgen"
version = "1.0.1"
edition = "2024"
description = "Generate afid ids — human-friendly random identifiers."
license = "MIT"
repository = "https://github.com/aJanuary/afid"
readme = "README.md"
keywords = ["id", "identifier", "random", "base32"]
categories = ["data-structures", "value-formatting"]

[dependencies]
rand = "0.10.1"

[dev-dependencies]
proptest = "1.11.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "generator"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.bench]
lto = "thin"
codegen-units = 1
