<svg
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   width="530px"
   height="130px">
  <g style="font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'">
   <text style="font-size: 40px; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" x="0" y="40">entity-2sed3-1p3pw40ds</text>
   <text style="font-style: italic; font-weight: bold" x="0" y="70">prefix</text>
   <text>
      <tspan x="0" y="90">describe what the id</tspan>
      <tspan x="0" y="108">is for with a prefix</tspan>
      <tspan x="0" y="126">you choose</tspan>
   </text>
   <text style="font-style: italic; font-weight: bold" x="170" y="70">tag</text>
   <text>
      <tspan x="170" y="90">tags let you easily</tspan>
      <tspan x="170" y="108">scan for ids</tspan>
      <tspan x="170" y="126">in blocks of text</tspan>
   </text>
   <text style="font-style: italic; font-weight: bold" x="315" y="70">suffix</text>
   <text>
      <tspan x="315" y="90">10-20 character suffix</tspan>
      <tspan x="315" y="108">provides enough entropy for</tspan>
      <tspan x="315" y="126">a billion ids per hour</tspan>
   </text>
  </g>
