    }
  </style>
  <g style="font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'">
   <text style="font-size: 40px; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" x="0" y="40">ent-2sed3-1p3dpw40ds</text>

   <g class="accent" fill="none" stroke="#888" stroke-width="1.5">
      <path d="M 0,55 L 0,60 L 33,60 L 36,63 L 39,60 L 72,60 L 72,55"/>
      <line x1="36" y1="63" x2="36" y2="84"/>
      <path d="M 96,55 L 96,60 L 153,60 L 156,63 L 159,60 L 216,60 L 216,55"/>
      <line x1="156" y1="63" x2="156" y2="184"/>
      <path d="M 240,55 L 240,60 L 357,60 L 360,63 L 363,60 L 480,60 L 480,55"/>
      <line x1="360" y1="63" x2="360" y2="84"/>
   </g>

   <text style="font-style: italic; font-weight: bold" x="10" y="100">prefix</text>
   <text>
      <tspan x="10" y="120">describe what the id</tspan>
      <tspan x="10" y="138">is for with a prefix</tspan>
      <tspan x="10" y="156">you choose</tspan>
   </text>

   <text style="font-style: italic; font-weight: bold" x="336" y="100">suffix</text>
