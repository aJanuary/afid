      <tspan x="336" y="120">10 or 20 character suffix</tspan>
      <tspan x="336" y="138">provides enough entropy for</tspan>
      <tspan x="336" y="156">10 thousand ids per hour</tspan>
   </text>

   <text style="font-style: italic; font-weight: bold" x="146" y="200">tag</text>
   <text>
      <tspan x="146" y="220">tags let you easily scan</tspan>
      <tspan x="146" y="238">for ids in blocks of text</tspan>
   </text>
